name: Sync vers miroir public (bibliotheque-app)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Pousser vers le miroir public (sans les workflows)
        env:
          GH_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "MIRROR_TOKEN absent — synchro ignoree"
            exit 0
          fi
          git clone --depth 1 https://x-access-token:${GH_TOKEN}@github.com/Chenzu-AI/Bibliotheque.git src
          cd src
          git rm -r --cached .github -q 2>/dev/null || true
          git -c user.name="Alphaprim (sync)" -c user.email="alphaprim@users.noreply.github.com" commit --allow-empty -m "Sync miroir public" -q
          git push https://x-access-token:${GH_TOKEN}@github.com/Chenzu-AI/bibliotheque-app.git +HEAD:main
